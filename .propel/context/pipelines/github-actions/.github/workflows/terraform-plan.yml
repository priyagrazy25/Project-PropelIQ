name: Terraform Plan

on:
  pull_request:
    paths:
      - '.propel/context/iac/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: '1.5.7'

jobs:
  # CICD-040/042: Terraform plan and validation
  plan-azure:
    name: Terraform Plan (Azure)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # CICD-042: Format check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: .propel/context/iac/azure/terraform/

      # CICD-042: Validate
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: .propel/context/iac/azure/terraform/environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: .propel/context/iac/azure/terraform/environments/${{ matrix.environment }}

      # CICD-040: Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        working-directory: .propel/context/iac/azure/terraform/environments/${{ matrix.environment }}
        continue-on-error: true

      # Post plan as PR comment
      - name: Comment PR with Plan
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan - Azure ${{ matrix.environment }}
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # CICD-041/025: IaC security scan
      - name: tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .propel/context/iac/azure/terraform/
          soft_fail: false

  plan-gcp:
    name: Terraform Plan (GCP)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: GCP Auth (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: .propel/context/iac/gcp/terraform/

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: .propel/context/iac/gcp/terraform/environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: .propel/context/iac/gcp/terraform/environments/${{ matrix.environment }}

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        working-directory: .propel/context/iac/gcp/terraform/environments/${{ matrix.environment }}
        continue-on-error: true

      - name: tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .propel/context/iac/gcp/terraform/
          soft_fail: false
