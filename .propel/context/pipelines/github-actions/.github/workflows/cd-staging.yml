name: Deploy to Staging

on:
  push:
    branches: [main]
    tags: ['v*.*.*-rc*']

permissions:
  contents: read
  id-token: write

jobs:
  ci-check:
    name: CI Verification
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  security-check:
    name: Security Verification
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit

  # CICD-031/032: Integration and E2E tests
  integration-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [ci-check]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ secrets.TEST_SQL_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # CICD-031: Integration tests
      - name: Run integration tests
        run: |
          dotnet test --configuration Release \
            --filter "Category=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
        working-directory: src/Backend
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=TestDB;User Id=sa;Password=${{ secrets.TEST_SQL_PASSWORD }};TrustServerCertificate=True;"

      # CICD-032: E2E tests with Playwright
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Playwright
        run: npx playwright install --with-deps
        working-directory: src/Frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: src/Frontend

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-e2e-results
          path: |
            src/Backend/TestResults/
            src/Frontend/playwright-report/

  # CICD-060: Staging deployment with approval gate
  deploy-staging:
    name: Deploy to Staging (Blue/Green)
    runs-on: ubuntu-latest
    needs: [ci-check, security-check, integration-tests]
    environment:
      name: staging
      url: https://upaci-staging-app.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # CICD-050: Blue/Green deployment via staging slot
      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: upaci-staging-app
          slot-name: staging
          package: ./publish

      # CICD-052: Smoke test on staging slot
      - name: Smoke Test (staging slot)
        run: |
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://upaci-staging-app-staging.azurewebsites.net/health/ready)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Staging slot smoke test failed"
            exit 1
          fi

      # Blue/Green swap
      - name: Swap staging slot to production
        run: |
          az webapp deployment slot swap \
            --resource-group upaci-staging-rg \
            --name upaci-staging-app \
            --slot staging \
            --target-slot production

      # CICD-052: Post-swap smoke test
      - name: Post-swap Smoke Test
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://upaci-staging-app.azurewebsites.net/health/ready)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Post-swap smoke test failed — initiating rollback"
            az webapp deployment slot swap \
              --resource-group upaci-staging-rg \
              --name upaci-staging-app \
              --slot staging \
              --target-slot production
            exit 1
          fi
