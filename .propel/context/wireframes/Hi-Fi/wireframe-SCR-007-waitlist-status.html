<!DOCTYPE html>
<!--
  WIREFRAME: SCR-007 Waitlist Status
  FIDELITY: High | VIEWPORT: 1440x900
  FLOW: FL-002 (waitlist from booking)
  NAV-LINKS: SCR-006 Dashboard: wireframe-SCR-006-patient-dashboard.html
  UXR: UXR-106 (Waitlist position clarity)
  COMPONENTS: Card(N), Badge(N), Button(N), Sidebar, Header
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR-007 Waitlist Status | Unified Patient Access</title>
    <style>
        :root {
            --color-primary: #1E6F9F;
            --color-primary-hover: #175F87;
            --color-secondary: #2D9F83;
            --color-danger: #D32F2F;
            --color-warning: #EF6C00;
            --color-text-primary: #111827;
            --color-text-secondary: #374151;
            --color-text-muted: #6B7280;
            --color-border: #D1D5DB;
            --color-surface: #FFF;
            --color-bg: #F9FAFB;
            --color-gray-100: #F3F4F6;
            --surface-info: #E8F4FD;
            --surface-success: #E6F7F1;
            --surface-warning: #FFF3E0;
            --surface-hover: #F3F4F6;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-1: 0 1px 3px rgba(0, 0, 0, .1);
            --shadow-2: 0 4px 6px rgba(0, 0, 0, .1);
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --duration-fast: 150ms;
            --easing-default: cubic-bezier(.4, 0, .2, 1);
            --header-height: 64px;
            --sidebar-width: 256px
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--font-primary);
            font-size: 16px;
            line-height: 1.5;
            color: var(--color-text-primary);
            background: var(--color-bg)
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-6);
            z-index: 100;
            box-shadow: var(--shadow-1)
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--space-2)
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--color-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: var(--color-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer
        }

        .sidebar {
            position: fixed;
            top: var(--header-height);
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
            padding: var(--space-4) 0;
            z-index: 90
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-6);
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: background var(--duration-fast) var(--easing-default)
        }

        .nav-item:hover {
            background: var(--surface-hover)
        }

        .nav-item.active {
            color: var(--color-primary);
            background: var(--surface-info);
            border-left-color: var(--color-primary);
            font-weight: 600
        }

        .nav-item:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: -2px
        }

        .nav-icon {
            width: 20px;
            text-align: center
        }

        .main-content {
            margin-left: var(--sidebar-width);
            margin-top: var(--header-height);
            padding: var(--space-8);
            min-height: calc(100vh - var(--header-height))
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: 14px;
            margin-bottom: var(--space-6)
        }

        .breadcrumb a {
            color: var(--color-primary);
            text-decoration: none
        }

        .breadcrumb a:hover {
            text-decoration: underline
        }

        .breadcrumb span {
            color: var(--color-text-muted)
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: var(--space-2)
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--color-text-muted);
            margin-bottom: var(--space-8)
        }

        .waitlist-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-4)
        }

        .waitlist-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-5);
            box-shadow: var(--shadow-1);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: var(--space-5);
            align-items: center
        }

        .waitlist-card:hover {
            box-shadow: var(--shadow-2)
        }

        .position-badge {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: var(--surface-info);
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700
        }

        .waitlist-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px
        }

        .waitlist-meta {
            font-size: 13px;
            color: var(--color-text-muted)
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px var(--space-2);
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500
        }

        .badge-warning {
            background: var(--surface-warning);
            color: var(--color-warning)
        }

        .badge-success {
            background: var(--surface-success);
            color: var(--color-secondary)
        }

        .badge-info {
            background: var(--surface-info);
            color: var(--color-primary)
        }

        .btn {
            height: 32px;
            padding: 0 var(--space-3);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background var(--duration-fast) var(--easing-default);
            display: inline-flex;
            align-items: center;
            justify-content: center
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-danger)
        }

        .btn-ghost:hover {
            background: var(--surface-hover)
        }

        .empty-state {
            text-align: center;
            padding: var(--space-12);
            color: var(--color-text-muted)
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: var(--space-4)
        }

        @media(max-width:768px) {
            .sidebar {
                display: none
            }

            .main-content {
                margin-left: 0
            }

            .waitlist-card {
                grid-template-columns: 1fr;
                text-align: center
            }
        }
    </style>
</head>

<body>
    <header class="app-header" role="banner"><a href="wireframe-SCR-006-patient-dashboard.html" class="logo"><span
                class="logo-icon" aria-hidden="true">+</span> Unified Patient Access</a>
        <div><span class="avatar" role="button" tabindex="0" aria-label="User menu">JD</span></div>
    </header>
    <nav class="sidebar" role="navigation" aria-label="Sidebar navigation">
        <a href="wireframe-SCR-006-patient-dashboard.html" class="nav-item"><span class="nav-icon">📊</span>
            Dashboard</a>
        <a href="wireframe-SCR-004-provider-search.html" class="nav-item"><span class="nav-icon">🔍</span> Book
            Appointment</a>
        <a href="wireframe-SCR-010-ai-intake.html" class="nav-item"><span class="nav-icon">📋</span> Intake</a>
        <a href="wireframe-SCR-014-document-upload.html" class="nav-item"><span class="nav-icon">📄</span> Documents</a>
        <a href="wireframe-SCR-016-360-degree-view.html" class="nav-item"><span class="nav-icon">❤️</span> Health
            Profile</a>
        <a href="wireframe-SCR-007-waitlist-status.html" class="nav-item active" aria-current="page"><span
                class="nav-icon">⏳</span> Waitlist</a>
    </nav>
    <main class="main-content" role="main">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a
                href="wireframe-SCR-006-patient-dashboard.html">Dashboard</a><span aria-hidden="true">›</span><span
                aria-current="page">Waitlist</span></nav>
        <h1 class="page-title">Waitlist Status</h1>
        <p class="page-subtitle">You'll be notified when an earlier slot becomes available.</p>
        <div class="waitlist-grid">
            <div class="waitlist-card" role="article">
                <div class="position-badge" aria-label="Position 3">#3</div>
                <div class="waitlist-info">
                    <h3>Dr. Sarah Mitchell · Primary Care</h3>
                    <div class="waitlist-meta">Requested: Dec 15 · Preferred: Morning slots · <span
                            class="badge badge-warning">Waiting</span></div>
                </div>
                <button class="btn btn-ghost" aria-label="Remove from waitlist">Remove</button>
            </div>
        </div>
    </main>
</body>

</html>
