<!DOCTYPE html>
<!--
  WIREFRAME: SCR-013 Insurance Pre-Check
  FIDELITY: High | VIEWPORT: 1440x900
  FLOW: FL-009 Insurance Pre-Check
  NAV-LINKS: SCR-005: wireframe-SCR-005-booking-confirmation.html, SCR-012: wireframe-SCR-012-intake-summary.html
  UXR: UXR-401 (Insurance validation clarity)
  COMPONENTS: TextField(2), Button(2), Card(1), Badge(1), Sidebar, Header
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR-013 Insurance Pre-Check | Unified Patient Access</title>
    <style>
        :root {
            --color-primary: #1E6F9F;
            --color-primary-hover: #175F87;
            --color-secondary: #2D9F83;
            --color-danger: #D32F2F;
            --color-text-primary: #111827;
            --color-text-secondary: #374151;
            --color-text-muted: #6B7280;
            --color-border: #D1D5DB;
            --color-surface: #FFF;
            --color-bg: #F9FAFB;
            --surface-info: #E8F4FD;
            --surface-success: #E6F7F1;
            --surface-danger: #FDECEC;
            --surface-hover: #F3F4F6;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-full: 9999px;
            --shadow-1: 0 1px 3px rgba(0, 0, 0, .1);
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --duration-fast: 150ms;
            --easing-default: cubic-bezier(.4, 0, .2, 1);
            --header-height: 64px;
            --sidebar-width: 256px
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--font-primary);
            font-size: 16px;
            line-height: 1.5;
            color: var(--color-text-primary);
            background: var(--color-bg)
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-6);
            z-index: 100;
            box-shadow: var(--shadow-1)
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--space-2)
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--color-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: var(--color-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer
        }

        .sidebar {
            position: fixed;
            top: var(--header-height);
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
            padding: var(--space-4) 0;
            z-index: 90
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-6);
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: background var(--duration-fast) var(--easing-default)
        }

        .nav-item:hover {
            background: var(--surface-hover)
        }

        .nav-item.active {
            color: var(--color-primary);
            background: var(--surface-info);
            border-left-color: var(--color-primary);
            font-weight: 600
        }

        .nav-icon {
            width: 20px;
            text-align: center
        }

        .main-content {
            margin-left: var(--sidebar-width);
            margin-top: var(--header-height);
            padding: var(--space-8);
            max-width: 600px
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: 14px;
            margin-bottom: var(--space-6)
        }

        .breadcrumb a {
            color: var(--color-primary);
            text-decoration: none
        }

        .breadcrumb a:hover {
            text-decoration: underline
        }

        .breadcrumb span {
            color: var(--color-text-muted)
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: var(--space-2)
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--color-text-muted);
            margin-bottom: var(--space-8)
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-6);
            box-shadow: var(--shadow-1);
            margin-bottom: var(--space-6)
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
            margin-bottom: var(--space-5)
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary)
        }

        .form-label .req {
            color: var(--color-danger)
        }

        .form-input {
            height: 40px;
            padding: 0 var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 16px;
            color: var(--color-text-primary)
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(30, 111, 159, .15)
        }

        .form-input::placeholder {
            color: var(--color-text-muted)
        }

        .result-card {
            padding: var(--space-4);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-top: var(--space-5)
        }

        .result-success {
            background: var(--surface-success);
            border: 1px solid var(--color-secondary)
        }

        .result-danger {
            background: var(--surface-danger);
            border: 1px solid var(--color-danger)
        }

        .result-icon {
            font-size: 24px
        }

        .result-text {
            font-size: 14px;
            font-weight: 500
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px var(--space-2);
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500
        }

        .badge-success {
            background: var(--surface-success);
            color: var(--color-secondary)
        }

        .action-bar {
            display: flex;
            gap: var(--space-3)
        }

        .btn {
            height: 40px;
            padding: 0 var(--space-4);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background var(--duration-fast) var(--easing-default)
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px
        }

        .btn-primary {
            background: var(--color-primary);
            color: #fff
        }

        .btn-primary:hover {
            background: var(--color-primary-hover)
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-text-muted)
        }

        .btn-ghost:hover {
            background: var(--surface-hover)
        }

        @media(max-width:768px) {
            .sidebar {
                display: none
            }

            .main-content {
                margin-left: 0
            }
        }
    </style>
</head>

<body>
    <header class="app-header" role="banner"><a href="wireframe-SCR-006-patient-dashboard.html" class="logo"><span
                class="logo-icon" aria-hidden="true">+</span> Unified Patient Access</a>
        <div><span class="avatar" role="button" tabindex="0" aria-label="User menu">JD</span></div>
    </header>
    <nav class="sidebar" role="navigation" aria-label="Sidebar navigation">
        <a href="wireframe-SCR-006-patient-dashboard.html" class="nav-item"><span class="nav-icon">📊</span>
            Dashboard</a><a href="wireframe-SCR-004-provider-search.html" class="nav-item"><span
                class="nav-icon">🔍</span> Book Appointment</a><a href="wireframe-SCR-010-ai-intake.html"
            class="nav-item active"><span class="nav-icon">📋</span> Intake</a><a
            href="wireframe-SCR-014-document-upload.html" class="nav-item"><span class="nav-icon">📄</span>
            Documents</a><a href="wireframe-SCR-016-360-degree-view.html" class="nav-item"><span
                class="nav-icon">❤️</span> Health Profile</a><a href="wireframe-SCR-007-waitlist-status.html"
            class="nav-item"><span class="nav-icon">⏳</span> Waitlist</a>
    </nav>
    <main class="main-content" role="main">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a
                href="wireframe-SCR-006-patient-dashboard.html">Dashboard</a><span aria-hidden="true">›</span><span
                aria-current="page">Insurance Pre-Check</span></nav>
        <h1 class="page-title">Insurance Pre-Check</h1>
        <p class="page-subtitle">Verify your insurance coverage before your visit.</p>
        <div class="card">
            <form novalidate>
                <div class="form-group"><label class="form-label" for="ins-name">Insurance Provider <span
                            class="req">*</span></label><input type="text" id="ins-name" class="form-input"
                        placeholder="e.g., Blue Cross Blue Shield"></div>
                <div class="form-group"><label class="form-label" for="ins-member">Member ID <span
                            class="req">*</span></label><input type="text" id="ins-member" class="form-input"
                        placeholder="e.g., XYZ123456789"></div>
                <div class="action-bar">
                    <button type="submit" class="btn btn-primary">Verify Coverage</button>
                    <a href="wireframe-SCR-012-intake-summary.html" class="btn btn-ghost">Skip</a>
                </div>
            </form>
            <!-- Success Result (shown after verification) -->
            <div class="result-card result-success" style="display:none;">
                <span class="result-icon" aria-hidden="true">✅</span>
                <div>
                    <div class="result-text">Coverage Verified</div>
                    <div style="font-size:13px;color:var(--color-text-muted);margin-top:2px;">Blue Cross Blue Shield ·
                        Active · Copay: $25</div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
