<!DOCTYPE html>
<!--
  WIREFRAME: SCR-003 Session Timeout Modal
  FIDELITY: High | VIEWPORT: 1440x900
  FLOW: Global (overlay on all authenticated screens)
  NAV-LINKS: SCR-002: wireframe-SCR-002-login.html
  UXR: UXR-603 (Session timeout)
  COMPONENTS: Modal(1), Button(2), ProgressBar(1)
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR-003 Session Timeout | Unified Patient Access</title>
    <style>
        :root {
            --color-primary: #1E6F9F;
            --color-primary-hover: #175F87;
            --color-secondary: #2D9F83;
            --color-danger: #D32F2F;
            --color-text-primary: #111827;
            --color-text-secondary: #374151;
            --color-text-muted: #6B7280;
            --color-border: #D1D5DB;
            --color-surface: #FFF;
            --color-bg: #F9FAFB;
            --color-gray-100: #F3F4F6;
            --surface-warning: #FFF8E1;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-3: 0 10px 15px rgba(0, 0, 0, .1);
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --duration-normal: 200ms;
            --easing-default: cubic-bezier(.4, 0, .2, 1)
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--font-primary);
            font-size: 16px;
            line-height: 1.5;
            color: var(--color-text-primary);
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh
        }

        /* Simulated full-page dim background to represent overlay */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500
        }

        .modal {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-3);
            max-width: 420px;
            width: 90%;
            padding: var(--space-8);
            text-align: center
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: var(--space-4)
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: var(--space-3)
        }

        .modal-body {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-5)
        }

        /* Countdown */
        .countdown {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            margin-bottom: var(--space-5)
        }

        .countdown-value {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 700;
            color: var(--color-danger)
        }

        .countdown-label {
            font-size: 13px;
            color: var(--color-text-muted)
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--color-gray-100);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: var(--space-6)
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            background: var(--color-danger);
            width: 25%;
            transition: width 1s linear
        }

        /* Warning note */
        .warning-note {
            padding: var(--space-3) var(--space-4);
            background: var(--surface-warning);
            border-radius: var(--radius-md);
            font-size: 13px;
            color: #B45309;
            margin-bottom: var(--space-6)
        }

        /* Buttons */
        .actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-3)
        }

        .btn {
            height: 44px;
            padding: 0 var(--space-6);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background var(--duration-normal) var(--easing-default)
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px
        }

        .btn-primary {
            background: var(--color-primary);
            color: #fff
        }

        .btn-primary:hover {
            background: var(--color-primary-hover)
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary)
        }

        .btn-ghost:hover {
            background: var(--color-gray-100)
        }
    </style>
</head>

<body>
    <div class="backdrop" role="dialog" aria-modal="true" aria-labelledby="timeout-title"
        aria-describedby="timeout-body">
        <div class="modal">
            <div class="modal-icon" aria-hidden="true">⏱️</div>
            <h1 class="modal-title" id="timeout-title">Session Expiring</h1>
            <p class="modal-body" id="timeout-body">Your session is about to expire due to inactivity. You will be
                automatically logged out in:</p>
            <div class="countdown" aria-live="polite" aria-atomic="true">
                <span class="countdown-value">1:30</span>
                <span class="countdown-label">minutes remaining</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"
                aria-label="Session time remaining">
                <div class="progress-fill"></div>
            </div>
            <div class="warning-note">⚠️ Unsaved changes will be lost if the session expires.</div>
            <div class="actions">
                <button class="btn btn-primary" autofocus>Extend Session</button>
                <a href="wireframe-SCR-002-login.html" class="btn btn-ghost">Log Out Now</a>
            </div>
        </div>
    </div>
</body>

</html>
